name: app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 lib test
      - run: flutter analyze
      - run: flutter test
      # Demo build: no server needed, no real money. Install it on any Android phone.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: avora-demo-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
